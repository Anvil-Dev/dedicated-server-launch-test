name: Dedicated Server Launch Test
description: Test if specified mods can launch on dedicated server environment
inputs:
  mods:
    description: The paths to the mod files (one path per line)
    required: false
    default: ""
  mod:
    description: Deprecated alias for mods
    required: false
    default: ""
    deprecationMessage: "The 'mod' input is deprecated. Use 'mods' instead."
  extra-mods:
    description: Path to extra mods (Modrinth <id>:<version> list)
    required: false
    default: ""
  maven-repos:
    description: The path pointing to the Maven repositories (Direct <url> list)
    required: false
    default: ""
  maven-mods:
    description: The path to the mod list file containing Maven coordinates (Maven <group>:<project>:<version> list)
    required: false
    default: ""
  url-mods:
    description: The file path pointing to a list containing mod download URLs (Direct <url> list)
    required: false
    default: ""
  other-files:
    description: The file path pointing to a list of URLs containing other resource files (Direct <path>@<url> list)
    required: false
    default: ""
  quiet-setup:
    description: Should be quiet when setup servers (boolean, true/false)
    required: false
    default: "False"
runs:
  using: composite
  steps:
    - name: Validate Mod Input
      if: ${{ inputs.mods == '' && inputs.mod == '' }}
      shell: bash
      run: |
        echo "::error::Either 'mods' or the deprecated 'mod' input must be provided."
        exit 1

    - name: Run Universal Dedicated Server Launch Test
      uses: Anvil-Dev/dedicated-server-launch-test@universal
      with:
        minecraft_version: "1.16.5"
        mod_loader: "forge"
        loader_version: "36.2.42"
        mods: ${{ inputs.mods || inputs.mod }}
        extra-mods: ${{ inputs.extra-mods }}
        maven-repos: ${{ inputs.maven-repos }}
        maven-mods: ${{ inputs.maven-mods }}
        url-mods: ${{ inputs.url-mods }}
        other-files: ${{ inputs.other-files }}
        quiet-setup: ${{ inputs.quiet-setup }}
